name: CI — FloydIA Agent Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install "PyYAML>=6.0"

      - name: "Compilación de scripts Python"
        run: python -m compileall -q skills

      - name: "Validar frontmatter de cada SKILL.md"
        run: |
          python - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob("skills/**/SKILL.md", recursive=True)):
              raw = open(f, encoding="utf-8").read()
              if not raw.startswith("---"):
                  bad.append(f"{f}: sin frontmatter YAML")
                  continue
              parts = raw.split("---", 2)
              try:
                  meta = yaml.safe_load(parts[1]) or {}
              except Exception as exc:
                  bad.append(f"{f}: frontmatter invalido ({exc})")
                  continue
              for key in ("name", "description"):
                  if not meta.get(key):
                      bad.append(f"{f}: falta la clave '{key}' en el frontmatter")
          print(f"skills validados: {len(glob.glob('skills/**/SKILL.md', recursive=True))}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          PY

      - name: "Sin secretos en el repo"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
